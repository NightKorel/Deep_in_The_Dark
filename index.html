<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潛淵</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 常駐上方狀態列，深潛中才顯示 -->
  <div id="top-status-bar" class="hidden">
    <span>💎 <span id="top-crystal">0</span></span>
    <span>🧪 <span id="top-potion">0</span>/<span id="top-potion-max">12</span></span>
    <span id="top-layer-progress"></span>
  </div>

  <!-- 左上角選單：存讀檔、改名、作弊 -->
  <button id="settings-toggle" onclick="toggleSettingsMenu()">☰</button>
  <div id="settings-menu" class="settings-dropdown">
    <button class="settings-menu-item" onclick="saveGameToFile()">💾 存檔</button>
    <button class="settings-menu-item" onclick="triggerLoadGameFile()">📂 讀檔</button>
    <button class="settings-menu-item" onclick="openRenameModal()">✏️ 改名</button>
    <button class="settings-menu-item" onclick="openSettingsOptionsModal()">⚙️ 設定</button>
    <button class="settings-menu-item" onclick="openAchievementsModal()">🏆 成就</button>
    <button class="settings-menu-item" onclick="openStoryLogModal()">📜 劇情回顧</button>
    <button class="settings-menu-item" onclick="openCheatModal()">🔧 作弊</button>
  </div>
  <input type="file" id="load-game-input" accept="application/json" style="display: none;" onchange="loadGameFromFile(event)">

  <!-- 一般提示通知 -->
  <div id="system-toast-container"></div>

  <!-- 主畫面容器：避難所／深潛地圖／開場劇情 動態渲染在這裡 -->
  <div id="main-screen"></div>

  <!-- 對話劇情層（開場劇情、深潛中的敘事文字用） -->
  <div id="dialogue-overlay" class="dialogue-overlay hidden">
    <div class="dialogue-box">
      <div id="dialogue-speaker" class="dialogue-speaker"></div>
      <div id="dialogue-text" class="dialogue-text"></div>
      <div id="dialogue-choices" class="dialogue-choices hidden"></div>
      <div class="dialogue-bottom-bar">
        <button id="dialogue-auto-btn" class="dialogue-auto-btn" onclick="cycleDialogueAuto()">▶ 自動</button>
        <button id="dialogue-next-btn" class="action-btn dialogue-next-btn" onclick="advanceDialogue()">繼續 ▾</button>
      </div>
    </div>
  </div>

  <!-- 戰鬥畫面（覆蓋層） -->
  <div id="battle-overlay" class="battle-overlay hidden">
    <div id="battle-root"></div>
  </div>

  <!-- 通用彈窗（節點事件／代價交換／寶藏／遺物分配／料理／技能管理／強化／確認等共用一個彈窗骨架） -->
  <div id="generic-modal" class="modal-overlay hidden" onclick="if(event.target===this) closeGenericModal()">
    <div class="modal-box" id="generic-modal-box">
      <h3 id="generic-modal-title"></h3>
      <div id="generic-modal-body"></div>
    </div>
  </div>

  <script src="js/01_資料庫.js"></script>
  <script src="js/02_介面共用與存讀檔.js"></script>
  <script src="js/03_開場劇情.js"></script>
  <script src="js/04_避難所.js"></script>
  <script src="js/05_深潛.js"></script>
  <script src="js/06_戰鬥.js"></script>
  <script src="js/07_成就.js"></script>
  <script src="js/08_賭場.js"></script>
  <script src="js/09_劇情記錄.js"></script>
</body>
</html>
